<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 564" role="img" aria-labelledby="t d"><title id="t">Autoformalization: how the pool of sources was built</title>
<desc id="d">Returned by the strings: Count 32,944; then Screened: Count 2,162; then Included as new: Count 182; plus Carried from the grey pass: Count 80; plus Linked from the family: Count 11; equals In the review: 273.</desc>
<style>
  .box { fill: #FFFFFF; stroke: #6A6D77; stroke-width: 1.5; }
  .total { fill: #EFEFF3; stroke: #101014; stroke-width: 1.5; }
