  .label { font: 400 13px Archivo, system-ui, sans-serif; fill: #55575F; }
  .na { font: italic 400 13px Archivo, system-ui, sans-serif; fill: #6A6D77; }
  .head { font: 600 14px Archivo, system-ui, sans-serif; fill: #101014; }
  .arrow { stroke: #55575F; stroke-width: 1.5; fill: none; marker-end: url(#tip); }
  #tip path { fill: #55575F; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #1A1A20; stroke: #9A9CA4; }
    .total { fill: #26262E; stroke: #F7F7F9; }
    .n, .head { fill: #F7F7F9; }
    .label { fill: #B8BAC2; }
    .na { fill: #9A9CA4; }
    .arrow { stroke: #B8BAC2; }
    #tip path { fill: #B8BAC2; }
  }
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="head" x="281.0" y="30" text-anchor="middle">Count</text>
